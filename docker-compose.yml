services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      SESSION_SECRET: local-dev-only-session-secret-change-me
      AUTH_ADAPTER: mock
      PAYMENTS_ADAPTER: mock
      MOCK_PAYMENTS_BASE_URL: http://localhost:3000/api/mock-payments
      PAYMENTS_TIMEOUT_MS: "5000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
